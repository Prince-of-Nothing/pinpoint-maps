name: build-region

# Builds one offline pack per matrix entry, publishes it as a GitHub release and
# regenerates catalog.json. Build logic lives in the app repo; this workflow
# only pins the ref, runs it and stores the result.

on:
  workflow_dispatch:
    inputs:
      region:
        description: Region id to build (Geofabrik slug, e.g. moldova)
        type: string
        required: true
      app_ref:
        description: Pinpoint branch, tag or SHA that provides scripts/offline
        type: string
        required: false
        default: main
      maxzoom:
        description: Optional basemap maxzoom cap (keeps each asset under 2 GiB)
        type: string
        required: false
      dry_run:
        description: Print the build plan only; skip publish, catalog and commit
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  region:
    name: ${{ matrix.region }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: build-region-${{ matrix.region }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        # ukraine is dispatch-only: its basemap peaks at 10-15 GB on a 14 GB runner.
        region: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.region)) || fromJSON('["moldova", "romania"]') }}
    env:
      REGION: ${{ matrix.region }}
      OUTPUT_ROOT: ${{ github.workspace }}/out
      MAXZOOM: ${{ inputs.maxzoom }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Check out the data repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check out the app at app_ref
        uses: actions/checkout@v4
        with:
          repository: Prince-of-Nothing/Pinpoint
          ref: ${{ inputs.app_ref || 'main' }}
          path: app
          fetch-depth: 1

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve release tag and version
        id: meta
        run: |
          if [[ ! "$REGION" =~ ^[a-z0-9-]{1,64}$ ]]; then
            echo "::error::invalid region id: $REGION"
            exit 1
          fi
          if [[ -n "$MAXZOOM" && ! "$MAXZOOM" =~ ^[0-9]{1,2}$ ]]; then
            echo "::error::maxzoom must be a number, got: $MAXZOOM"
            exit 1
          fi
          version="$(date -u +%Y%m%d)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=data-$REGION-$version" >> "$GITHUB_OUTPUT"
          echo "release_url=https://github.com/${{ github.repository }}/releases/download/data-$REGION-$version" >> "$GITHUB_OUTPUT"

      - name: Build region pack
        shell: pwsh
        env:
          RELEASE_URL: ${{ steps.meta.outputs.release_url }}
        run: |
          $extra = @()
          if ($env:MAXZOOM) { $extra += @("-Maxzoom", $env:MAXZOOM) }
          if ($env:DRY_RUN -eq 'true') { $extra += '-DryRun' }
          pwsh ./app/scripts/offline/build.ps1 -Region $env:REGION -OutputRoot $env:OUTPUT_ROOT -BaseUrl $env:RELEASE_URL -AllowUnpinnedSource @extra

      - name: Publish data release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # A same-day rebuild replaces that day's release instead of piling up assets.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" "$OUTPUT_ROOT/$REGION"/* \
            --title "Pinpoint map data: $REGION $VERSION" \
            --notes "Automated build of \`$REGION\` from the pinned Geofabrik extract. Map data (c) OpenStreetMap contributors, ODbL 1.0. See ATTRIBUTION.md." \
            --prerelease --latest=false
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for required in "$REGION.pmtiles" "$REGION.graph.bin.gz" manifest.json ATTRIBUTION.md; do
            if ! printf '%s\n' "$assets" | grep -qx "$required"; then
              echo "::error::release $TAG is missing asset: $required"
              exit 1
            fi
          done

      - name: Regenerate catalog.json
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          RELEASE_URL: ${{ steps.meta.outputs.release_url }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          pwsh ./app/scripts/offline/catalog.ps1 -RegionDir "$env:OUTPUT_ROOT/$env:REGION" -Catalog catalog.json -BaseUrl "$env:RELEASE_URL" -Version "$env:VERSION"

      - name: Validate catalog and schema
        if: ${{ !inputs.dry_run }}
        run: |
          node scripts/validate-catalog.mjs
          node --test scripts/validate-catalog.test.mjs

      - name: Commit catalog.json
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if git diff --quiet -- catalog.json; then
            echo "catalog.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "chore: catalog $REGION $VERSION"
          # shortcut: parallel region jobs can race on this file; retry on a fresh
          # base and fail loudly (a re-run rebuilds and repairs the catalog).
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main
          done
          echo "::error::could not push catalog.json"
          exit 1
